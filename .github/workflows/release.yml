name: Release obsidian plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

env:
  PLUGIN_NAME: obsidian-advanced-html-export # Plugin ID from manifest.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - name: Build
        run: |
          npm install
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp dist/main.js dist/manifest.json dist/styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
      - name: Extract Changelog
        id: changelog
        run: |
           # Extract the changelog for the current tag (remove 'v' prefix if present)
           TAG_NAME=${GITHUB_REF_NAME#v}
           # Extract the changelog section for this version
           CHANGELOG_BODY=$(awk "/^## \[$TAG_NAME\]/ {flag=1; next} flag && /^## \[/ {exit} flag {print}" CHANGELOG.md)
           if [ -n "$CHANGELOG_BODY" ]; then
             echo "body<<EOF" >> $GITHUB_OUTPUT
             echo "$CHANGELOG_BODY" >> $GITHUB_OUTPUT
             echo "EOF" >> $GITHUB_OUTPUT
           else
             echo "body=No changelog found for version $TAG_NAME" >> $GITHUB_OUTPUT
           fi
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            dist/main.js
            dist/styles.css
            dist/manifest.json